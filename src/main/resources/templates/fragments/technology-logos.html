<!doctype html><html lang="en" xmlns:th="http://www.thymeleaf.org"><body>
<!-- Source brand marks: Font Awesome Free brand assets and Simple Icons brand shapes;
     original approved Docker, AWS, Terraform, and Kubernetes artwork is reused. -->
<div class="tech-group" th:fragment="technologyLogos">
  <h2 class="group-label">Technologies I work with</h2>
  <div class="techs" aria-label="Technologies I work with">
    <figure class="tech-tech"><img src="/images/tech/java.svg" th:src="@{/images/tech/java.svg}" alt="Java logo" width="36" height="32"><figcaption>Java</figcaption></figure>
    <figure class="tech-tech"><img src="/images/tech/spring.svg" th:src="@{/images/tech/spring.svg}" alt="Spring logo" width="36" height="32"><figcaption>Spring</figcaption></figure>
    <figure class="tech-tech"><img src="/images/tech/python.svg" th:src="@{/images/tech/python.svg}" alt="Python logo" width="36" height="32"><figcaption>Python</figcaption></figure>
    <figure class="tech-tech"><img src="/images/tech/mongodb.svg" th:src="@{/images/tech/mongodb.svg}" alt="MongoDB logo" width="36" height="32"><figcaption>MongoDB</figcaption></figure>
    <figure class="tech-tech"><img src="/images/tech/docker-approved.svg" th:src="@{/images/tech/docker-approved.svg}" alt="Docker logo" width="36" height="32"><figcaption>Docker</figcaption></figure>
    <figure class="tech-tech"><img src="/images/tech/amazon-web-services-approved.svg" th:src="@{/images/tech/amazon-web-services-approved.svg}" alt="Amazon Web Services logo" width="36" height="32"><figcaption>AWS</figcaption></figure>
    <figure class="tech-tech"><img src="/images/tech/terraform-approved.svg" th:src="@{/images/tech/terraform-approved.svg}" alt="Terraform logo" width="36" height="32"><figcaption>Terraform</figcaption></figure>
    <figure class="tech-tech"><img src="/images/tech/kubernetes-approved.svg" th:src="@{/images/tech/kubernetes-approved.svg}" alt="Kubernetes logo" width="36" height="32"><figcaption>Kubernetes</figcaption></figure>
    <figure class="tech-tech"><img src="/images/tech/github-actions.svg" th:src="@{/images/tech/github-actions.svg}" alt="GitHub Actions logo" width="36" height="32"><figcaption>GitHub Actions</figcaption></figure>
    <figure class="tech-tech"><img src="/images/tech/jenkins.svg" th:src="@{/images/tech/jenkins.svg}" alt="Jenkins logo" width="36" height="32"><figcaption>Jenkins</figcaption></figure>
    <figure class="tech-tech"><img src="/images/tech/grafana.png" th:src="@{/images/tech/grafana.png}" alt="Grafana logo" width="36" height="32"><figcaption>Grafana</figcaption></figure>
    <figure class="tech-tech"><img src="/images/tech/prometheus.png" th:src="@{/images/tech/prometheus.png}" alt="Prometheus logo" width="36" height="32"><figcaption>Prometheus</figcaption></figure>
  </div>
</div>
</body></html>
